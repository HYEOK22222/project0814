<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 상세 화면</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/product.css" />
  <link rel="stylesheet" href="css/order.css" />
</head>

<body>
  <div class="demo-holy-grid">
    <header class="hg-header">
      <nav class="demo-nav">
<div class="logo"><a href="index.html">전설의 시작</a></div>
        <div class="searchbox">
        <input type="text" placeholder="  검색어를 입력하세요." />
        <button>
          <img class="btn-img" src="search_icon.png" alt="검색버튼" />
        </button>
        </div>
         <ul class="menu-list">
          <li><a href="login-page.html" id="login-page">로그인</a></li>
          <li><a href="myorder.html" id="myorder" style="display: none;" class="loginout">내 주문 내역</a></li>
          <li><a href="mypage.html" style="display: none;" class="loginout">내 정보</a></li>
          <li><a href="" style="display: none;" id="logout-btn" class="loginout">로그아웃</a></li>
      </nav>
    </header>

  <main class="product-detail-page">
    <section class="product-top-area">
      <div class="product-image-wrap">
        <div class="thumbnail-list">
          <button class="thumb-btn">
            <img src="thumb1.jpg" alt="썸네일 1" />
          </button>
        </div>
      </div>

      <div class="product-info-wrap">
        <p class="product-category">카테고리 > 하위 카테고리</p>
        <h1 class="product-name">상품 이름ㅁㅁㅁㅁㅁㅁㅁㅁㅁㅁㅁ</h1>

        <div class="product-price-info">
          <strong class="final-price">1,000,000,000원</strong>
        </div>

        <hr class="divider" />

        <div class="product-options">
          <div class="option-group">
            <label class="option-label" for="color-select">색상</label>
            <select class="option-select" id="color-select">
              <option value="">색상 선택</option>
              <option value="black">블랙</option>
              <option value="white">화이트</option>
            </select>
          </div>
          <div class="option-group">
            <label class="option-label" for="size-select">사이즈</label>
            <select class="option-select" id="size-select">
              <option value="">사이즈 선택</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
            </select>
          </div>
        </div>

        <div class="product-quantity">
          <span class="quantity-label">수량</span>
          <div class="quantity-controls">
            <input class="input-qty" type="number" value="1" min="1" />
          </div>
        </div>

        <hr class="divider" />

        <div class="total-price-wrap">
          <span class="total-label">총 상품 금액</span>
          <strong class="total-amount">1,000,000,000원</strong>
        </div>

        <div class="product-actions">
          <button class="btn-action btn-wishlist">찜하기</button>
          <button class="btn-action btn-cart">장바구니</button>
          <button class="btn-action btn-buy">바로 구매</button>
        </div>
      </div>
    </section>

    <section class="product-bottom-area">
      <nav class="detail-tab-menu">
        <button class="tab-btn active">상품상세</button>
        <button class="tab-btn">상품평 (120)</button>
        <button class="tab-btn">상품문의</button>
        <button class="tab-btn">배송/교환안내</button>
      </nav>

      <div class="detail-tab-content">
        <div class="content-description">
          <p>
            상품입니다ㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏㅏ
          </p>
        </div>
      </div>
    </section>
    <!-- 기존 코드의 <section class="product-bottom-area"> ... </section> 바로 아래에 이 코드를 추가하세요 -->
    
    <!-- 1. 리뷰 영역 (동적 렌더링용 빈 공간) -->
    <section id="review-section" class="review-area">
      <div class="review-header-wrap">
        <h2 class="review-title">상품평 <span class="review-count">(0)</span></h2>
        <button id="btn-open-review-modal" class="btn-write-review">리뷰 작성하기</button>
      </div>
      
      <!-- 자바스크립트를 통해 서버에서 받아온 리뷰 목록이 여기에 들어갑니다. -->
      <div id="dynamic-review-list" class="review-list">
        <p class="empty-review">불러오는 중...</p>
      </div>
    </section>

    <!-- 2. 리뷰 등록 페이지 (모달 창) -->
    <div id="review-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h3 class="modal-title">리뷰 작성</h3>
        
        <div class="form-group">
          <label for="rating-select">평점</label>
          <select id="rating-select" class="review-input">
            <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
            <option value="4">⭐⭐⭐⭐ (4점)</option>
            <option value="3">⭐⭐⭐ (3점)</option>
            <option value="2">⭐⭐ (2점)</option>
            <option value="1">⭐ (1점)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="review-textarea">내용</label>
          <textarea id="review-textarea" class="review-input" rows="5" placeholder="상품에 대한 솔직한 평가를 남겨주세요."></textarea>
        </div>

        <div class="modal-actions">
          <button id="btn-cancel-modal" class="btn-modal cancel">취소</button>
          <button id="btn-submit-review" class="btn-modal submit">등록</button>
        </div>
      </div>
    </div>

  <!-- 이 아래에 기존의 </main> 태그가 있어야 합니다 -->
  </main>
</body>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    // ==========================================
    // 1. 공통 로그인/로그아웃 상태 확인 및 처리
    // ==========================================
    const token = sessionStorage.getItem("accessToken");
    
    const loginButton = document.querySelector('a[href="login-page.html"]'); 
    const logoutButtons = document.querySelectorAll(".loginout");
    
    if (token && loginButton) {
      // 로그인 상태일 때
      loginButton.style.display = "none";
      logoutButtons.forEach(e => {
        e.style.display = "inline";
      });
    } else if (loginButton) {
      // 💡 [추가된 기능] 로그인이 안 된 상태에서 '로그인' 메뉴를 누를 때
      loginButton.addEventListener("click", () => {
        // 로그인 완료 후 다시 돌아오기 위해 현재 페이지 주소를 기억해둡니다.
        sessionStorage.setItem("returnUrl", window.location.href);
      });
    }

    // 로그아웃 클릭 처리
    logoutButtons.forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault(); 
        sessionStorage.removeItem("accessToken"); 
        alert("로그아웃 되었습니다.");
        window.location.reload(); 
      });
    });

    // ==========================================
    // 공통 사용 변수 (상품 ID)
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id") || 51;

    // ==========================================
    // 2. 상품 기본 정보 불러오기
    // ==========================================
    try {
      const response = await fetch(`http://teacherdev09.kro.kr:10002/endpoint/api/products/${productId}`);
      if (!response.ok) throw new Error("상품 정보를 불러오는데 실패했습니다!");
      const result = await response.json();

      if (result.success) {
        const product = result.data;
        document.querySelector(".product-category").textContent = product.category;
        document.querySelector(".product-name").textContent = product.name;
        const priceString = product.price.toLocaleString() + "원";
        document.querySelector(".final-price").textContent = priceString;
        document.querySelector(".total-amount").textContent = priceString;
        document.querySelector(".content-description p").textContent = product.description;
      } else {
        document.querySelector(".product-name").textContent = "상품 정보가 없습니다.";
      }
    } catch (error) {
      document.querySelector(".product-name").textContent = "서버 연결에 실패했습니다.";
    }

    // ==========================================
    // 3. 상품평 탭 자동 스크롤
    // ==========================================
    const tabButtons = document.querySelectorAll(".tab-btn");
    let reviewBtn = null;
    tabButtons.forEach(btn => { if(btn.textContent.includes("상품평")) reviewBtn = btn; });
    const reviewSection = document.getElementById("review-section");

    if (reviewBtn && reviewSection) {
      reviewBtn.addEventListener("click", () => {
        reviewSection.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    // ==========================================
    // 4. 동적 리뷰 불러오기 및 모달 기능
    // ==========================================
    const reviewsUrl = `http://teacherdev09.kro.kr:10002/endpoint/api/products/${productId}/reviews`;

    const fetchReviews = async () => {
      try {
        const response = await fetch(reviewsUrl);
        const result = await response.json();
        const reviewListDiv = document.getElementById("dynamic-review-list");
        const reviewCountSpan = document.querySelector(".review-count");

        if (result.success && result.data.length > 0) {
          reviewCountSpan.textContent = `(${result.data.length})`;
          reviewListDiv.innerHTML = result.data.map(review => `
            <div class="review-item">
              <div class="review-header">
                <span class="reviewer-name">${review.author || '익명'}</span>
                <span class="review-rating">${'⭐'.repeat(review.rating)}</span>
              </div>
              <div class="review-content">${review.content}</div>
            </div>
          `).join('');
        } else {
          reviewCountSpan.textContent = `(0)`;
          reviewListDiv.innerHTML = `<p class="empty-review">등록된 상품평이 없습니다. 첫 리뷰를 작성해보세요!</p>`;
        }
      } catch (error) {
        document.getElementById("dynamic-review-list").innerHTML = `<p class="empty-review">리뷰를 불러오는데 실패했습니다.</p>`;
      }
    };

    fetchReviews();

    const modal = document.getElementById("review-modal");
    const btnOpenModal = document.getElementById("btn-open-review-modal");
    const btnCancel = document.getElementById("btn-cancel-modal");
    const btnSubmit = document.getElementById("btn-submit-review");

    btnOpenModal.addEventListener("click", () => {
      if (!token) { 
        alert("로그인이 필요한 서비스입니다.");
        // 💡 [추가된 기능] 리뷰 작성하려고 했는데 로그인이 안 되어 있다면,
        // 현재 주소를 저장하고 자동으로 로그인 페이지로 넘겨줍니다!
        sessionStorage.setItem("returnUrl", window.location.href);
        window.location.href = "login-page.html";
        return; 
      }
      modal.classList.remove("hidden");
    });

    btnCancel.addEventListener("click", () => {
      modal.classList.add("hidden");
      document.getElementById("review-textarea").value = ""; 
    });

    btnSubmit.addEventListener("click", async () => {
      const rating = document.getElementById("rating-select").value;
      const content = document.getElementById("review-textarea").value.trim();

      if (!content) { alert("리뷰 내용을 입력해주세요."); return; }

      try {
        const response = await fetch(reviewsUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ rating: Number(rating), content: content })
        });
        const result = await response.json();

        if (result.success || response.ok) {
          alert("리뷰가 성공적으로 등록되었습니다!");
          modal.classList.add("hidden"); 
          document.getElementById("review-textarea").value = ""; 
          fetchReviews(); 
        } else { alert("리뷰 등록에 실패했습니다."); }
      } catch (error) { alert("서버 오류가 발생했습니다."); }
    });
    const btnBuy = document.querySelector(".btn-buy");
    
    if (btnBuy) {
      btnBuy.addEventListener("click", () => {
        // 💡 주문 페이지로 이동할 때, 어떤 상품을 주문하는지 알아야 하므로
        // 현재 상품의 id 값을 주소 뒤에 달아서(order.html?id=번호) 보내줍니다!
        window.location.href = `order.html?id=${productId}`;
      });
    }
  });
</script>

</html>
