<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="logo"><a href="index.html">전설의 시작</a></div>
      <form>
        <div class="info">아이디</div>
        <input
          class="signInput"
          id="userId"
          name="userId"
          type="text"
          placeholder=" 이메일을 입력하세요."
        />

        <div class="info">
          비밀번호
          <input
            class="signInput"
            id="password"
            name="password"
            type="password"
            placeholder=" 비밀번호를 입력하세요."
          />
        </div>
        <button class="btn-action btn-login" id="login-btn">로그인</button>
      </form>
      <button class="noneType-btn" id="register-btn">회원가입</button>
    </div>

    <script>
      document.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = e.target.userId.value;
        const password = e.target.password.value;
        try {
          const response = await fetch(
            "http://teacherdev09.kro.kr:10002/endpoint/api/users/login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            },
          );
          if (!response.ok) {
            throw new Error("로그인 정보 불일치");
          }
          const data = await response.json();
          sessionStorage.setItem("accessToken", data.data.accessToken);
          alert("환영합니다");
          window.location.href = "./index.html";
        } catch (error) {
          alert(error.message);
        }
      });

      const registerBtn = document.getElementById("register-btn");
      registerBtn.addEventListener("click", () => {
        window.location.href = "./register.html";
      });
    </script>
  </body>
</html>
