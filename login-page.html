<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="login-container">
    <form>
      <div class="info">아이디
        <input class="signInput" id="userId" name="userId" type="text" placeholder="아이디를 입력하세요." />
      </div>
      <div class="info">비밀번호
        <input class="signInput" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요." />
      </div>
      <button id="login-btn">로그인</button>
    </form>
  </div>

  <script>
    document
      .querySelector("form")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = e.target.userId.value;
        const password = e.target.password.value;
        try {
          const response = await fetch("http://teacherdev09.kro.kr:10002/endpoint/api/users/login", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          if (!response.ok) {
            throw new Error('로그인 정보 불일치')
          }
          const data = await response.json();
          alert('환영합니다');
          window.location.href = '/index.html';
        } catch (error) {
          alert(error.message)
        }
      })

  </script>

</body>

</html>
