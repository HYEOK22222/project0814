<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order</title>
  <link rel="stylesheet" href="css/style.css" , />
  <link rel="stylesheet" href="css/product.css" />
  <link rel="stylesheet" href="css/order.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <div class="demo-holy-grid">
    <!-- 헤더 -->
    <header class="hg-header">
      <nav class="demo-nav">
        <div class="logo"><a href="index.html">전설의 시작</a></div>
        <div class="searchbox">
          <select id="category-select" class="custom-select">
            <option value="">카테고리 선택</option>
            <!-- 나머지는 자바스크립트(API)가 채워줄 겁니다! -->
          </select>
          <input type="text" class="searchbox_text" placeholder="검색어를 입력하세요." />
            <button id="main-search-btn">
              <img class="btn-img" src="search_icon.png" alt="검색버튼" />
            </button>
          </div>
         <ul class="menu-list">
          <li><a href="login-page.html" id="login-page">로그인</a></li>
          <li><a href="myorder.html" id="myorder" style="display: none;" class="loginout">내 주문 내역</a></li>
          <li><a href="mypage.html" style="display: none;" class="loginout">내 정보</a></li>
          <li><a href="" style="display: none;" id="logout-btn" class="loginout">로그아웃</a></li>
          </ul>
      </nav>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="hg-content">
      <div class="order-page-wrap">
        <!-- 주문 입력 폼 -->
        <div id="orderFormArea">
          <h1 class="order-title">Order</h1>
          <hr class="divider" />

          <div class="order-grid">
            <!-- 왼쪽: 옵션 및 배송 정보 선택 -->
            <div>
              <div class="option-group">
                <label class="option-label">주문 상품</label>
                <div style="
                            background-color: #272727;
                            border: 1px solid #505050;
                            border-radius: 8px;
                            padding: 12px 15px;
                            display: flex;
                            justify-content: space-between;
                            align-items: center;">
                  <span id="orderProductName" style="font-weight: bold; color: #fff; font-size: 1.05rem">상품 불러오는
                    중...</span>


                </div>
              </div>

              <div class="option-group" style="margin-top: 15px">
                <label class="option-label">주문 수량</label>
                <div class="qty-control">
                  <button type="button" class="qty-btn" id="btnMinus">
                    -
                  </button>
                  <input type="number" id="qtyInput" class="input-qty" value="1" min="1" readonly />
                  <button type="button" class="qty-btn" id="btnPlus">
                    +
                  </button>
                </div>
              </div>

              <div class="option-group" style="margin-top: 15px">
                <label class="option-label" for="userName">주문자 성함</label>
                <!-- ⬇️ style 속성을 아예 지워버립니다 -->
                <input type="text" id="userName" class="signInput" placeholder="이름을 입력하세요" />
              </div>

              <div class="option-group" style="margin-top: 15px">
                <label class="option-label" for="userAddress">배송지 주소</label>
                <!-- ⬇️ 여기도 style 속성을 지워줍니다 -->
                <input type="text" id="userAddress" class="signInput" placeholder="배송 주소를 입력하세요" />
              </div>
            </div>

            <!-- 오른쪽: 주문 요약 및 결제 금액 카드 -->
            <div class="summary-card">
              <div>
                <h3 style="color: #cebb7b; margin-bottom: 15px">
                  주문 내역 요약
                </h3>

                <div class="summary-row">
                  <span style="color: #bbb">선택 상품</span>
                  <span id="summaryProductName" style="font-weight: 500">""</span>
                </div>

                <div class="summary-row">
                  <span style="color: #bbb">수량</span>
                  <span id="summaryQty">1개</span>
                </div>

                <div class="summary-row">
                  <span style="color: #bbb">배송비</span>
                  <span style="color: #cebb7b">무료배송</span>
                </div>

                <div class="summary-row total">
                  <span class="total-label">최종 결제금액</span>
                  <span class="total-amount" id="summaryTotal">₩</span>
                </div>
              </div>

              <!-- 구매하기 버튼 -->
              <button type="button" id="btnOrder" class="btn-action btn-buy" style="margin-top: 20px">
                주문 완료하기
              </button>
            </div>
          </div>
        </div>
        <!-- 주문 완료 후 성공 메시지 출력 -->
    </main>

    <!-- 푸터-->
    <footer class="hg-footer">
    </footer>
  </div>

  <!-- 수량 연동 및 주문 처리 스크립트 -->
  <script>
    let currentProduct = {
    id: null,
    name: "상품 불러오는 중...",
    price: 0
  };
    const orderProductName = document.getElementById("orderProductName");
    const summaryProductName = document.getElementById("summaryProductName");
    const summaryQty = document.getElementById("summaryQty");
    const summaryTotal = document.getElementById("summaryTotal");

    const qtyInput = document.getElementById("qtyInput");
    const btnMinus = document.getElementById("btnMinus");
    const btnPlus = document.getElementById("btnPlus");
    const btnOrder = document.getElementById("btnOrder");


    const updateOrderSummary = () => {
      const qty = Number(qtyInput.value);
      const totalPrice = currentProduct.price * qty;

      summaryProductName.textContent = currentProduct.name;
      summaryQty.textContent = `${qty}개`;
      summaryTotal.textContent = `${totalPrice.toLocaleString()}원`;
    };

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id");
    const initialQty = Number(urlParams.get("stockQuantity"));

    document.addEventListener("DOMContentLoaded", async () => {
      // ==========================================
      // ⭐ 1. 로그인 체크 및 상단 메뉴 켜주기 (추가된 부분)
      // ==========================================
      const token = sessionStorage.getItem("accessToken");
      
      // 만약 토큰이 없다면 (비로그인 상태로 주소창을 치고 들어왔다면) 튕겨냅니다!
      if (!token) {
        alert("로그인이 필요한 페이지입니다.");
        window.location.href = "login-page.html";
        return; 
      }

      // 로그인 상태라면 상단바 메뉴를 바꿔줍니다.
      const loginButton = document.querySelector("#login-page");
      const logoutButtons = document.querySelectorAll(".loginout");
      if (loginButton) loginButton.style.display = "none";
      logoutButtons.forEach((e) => (e.style.display = "inline"));

      // 로그아웃 기능 연결
      const logoutBtn = document.querySelector("#logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", (e) => {
          e.preventDefault();
          sessionStorage.removeItem("accessToken");
          alert("로그아웃 되었습니다");
          window.location.href = "./index.html";
        });
      }

      // ==========================================
      // ⭐ 2. 공통 검색 및 카테고리 기능 (추가된 부분)
      // ==========================================
      const searchInput = document.querySelector(".searchbox input");
      const searchBtn = document.querySelector("#main-search-btn");
      const categorySelect = document.querySelector("#category-select");

      if (searchInput && searchBtn) {
        const executeSearchRedirect = () => {
          const keyword = searchInput.value.trim();
          const category = categorySelect ? categorySelect.value : "";

          if (!keyword && !category) {
            alert("검색어를 입력하거나 카테고리를 선택해주세요.");
            return;
          }
          window.location.href = `index.html?keyword=${encodeURIComponent(keyword)}&category=${encodeURIComponent(category)}`;
        };

        searchBtn.addEventListener("click", executeSearchRedirect);
        searchInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") executeSearchRedirect();
        });
        if (categorySelect) {
          categorySelect.addEventListener("change", executeSearchRedirect);
        }
      }

      if (categorySelect && categorySelect.options.length <= 1) {
        try {
          const res = await fetch("http://teacherdev09.kro.kr:10002/endpoint/api/products?size=50");
          const result = await res.json();

          if (result.success && result.data && result.data.content) {
            const allProducts = result.data.content;
            const categories = [...new Set(allProducts.map((p) => p.category).filter(Boolean))];

            categories.forEach((category) => {
              const option = document.createElement("option");
              option.value = category;
              option.textContent = category;
              categorySelect.appendChild(option);
            });
          }
        } catch (error) {
          console.error("카테고리를 불러오지 못했습니다.", error);
        }
      }

      // ==========================================
      // ⬇️ 기존 상품 데이터 불러오기 코드 (그대로 둡니다)
      // ==========================================
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("productId") || 1;
      const initialQty = urlParams.get("quantity") || 1;

      qtyInput.value = 1;

      try {
        const response = await fetch(
          `http://teacherdev09.kro.kr:10002/endpoint/api/products/${productId}`
        );

        if (!response.ok) {
          throw new Error("상품 정보를 불러오는데 실패했습니다");
        }

        const result = await response.json();

        if (result.success) {
          const product = result.data;
          currentProduct.id = product.id;
          currentProduct.name = product.name;
          currentProduct.price = product.price;

          orderProductName.textContent = currentProduct.name;
          updateOrderSummary();
        } else {
          console.error(result.message);
        }
      } catch (error) {
        console.error("에러 발생:", error.message);
      }
    });

    // 수량 증감 버튼 이벤트 
    btnPlus.addEventListener("click", () => {
      let count = Number(qtyInput.value);
      if (count < initialQty){
        qtyInput.value = ++count;
        updateOrderSummary();
      }else
      alert(`해당 상품의 최대 주문 가능 수량은 ${initialQty}개입니다.`);
    });

    btnMinus.addEventListener("click", () => {
      let count = Number(qtyInput.value);
      if (count > 1) {
        qtyInput.value = --count;
        updateOrderSummary();
      }
    });

    btnOrder.addEventListener("click", async () => {
      const userName = document.getElementById("userName").value.trim();
      const userAddress = document.getElementById("userAddress").value.trim();
      const qty = Number(qtyInput.value);

      if (userName.length === 0) {
        alert("주문자 성함을 입력해주세요.");
        return;
      }

      if (userAddress.length === 0) {
        alert("배송 주소를 입력해주세요.");
        return;
      }

      const payload = {
        customerName: userName,         
        shippingAddress: userAddress,   
        items: [
          {
        id: 0,
        productId: currentProduct.id,
        productName: currentProduct.name,
        quantity: qty,
        orderPrice: currentProduct.price * qty
          }
        ]
      };
      const userToken = sessionStorage.getItem("accessToken"); 
      console.log(userToken)

      if (!userToken) {
        alert("주문을 진행하려면 로그인이 필요합니다.");
        window.location.href = "login-page.html";
        return;
      }

      try {
        const response = await fetch(
          "http://teacherdev09.kro.kr:10002/endpoint/api/orders",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${userToken}`,
            },
            body: JSON.stringify(payload)
          }
        );

        if (!response.ok) {
          throw new Error(`주문 처리 에러: ${response.status}`);
        }

        const result = await response.json();

        if (result.success) {
          alert("주문이 성공적으로 완료되었습니다!");
        } else {
          alert(result.message || "주문 처리에 실패했습니다.");
        }
      } catch (error) {
        console.error("에러 발생:", error.message);
        alert("서버 연결에 실패했습니다.");
      }
    });
    // 초기 실행
    updateOrderSummary();
  </script>
</body>

</html>
