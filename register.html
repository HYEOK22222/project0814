<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="logo"><a href="index.html">전설의 시작</a></div>
      <form>
        <div class="loginpage_info">아이디</div>
        <input
          class="signInput"
          id="email"
          name="email"
          type="text"
          placeholder="이메일을 입력하세요."
        />

        <div class="loginpage_info">비밀번호</div>
        <input
          class="signInput"
          id="password"
          name="password"
          type="password"
          placeholder="비밀번호를 입력하세요."
        />

        <div class="loginpage_info">이름</div>
        <input
          class="signInput"
          id="name"
          name="name"
          type="text"
          placeholder="이름을 입력하세요."
        />

        <div class="loginpage_info">주소</div>
        <input
          class="signInput"
          id="address"
          name="address"
          type="text"
          placeholder="주소를 입력하세요."
        />

        <button class="btn-action btn-login" id="register-btn">회원가입</button>
      </form>
      <button class="noneType-btn" id="loginPage-btn">로그인하러 가기</button>
    </div>

    <script>
      document.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = e.target.email.value.trim();
        const password = e.target.password.value;
        const name = e.target.name.value.trim();
        const address = e.target.address.value;
        console.log(name, email, password, address);

        try {
          // 서버 엔드포인트에 맞게 호출
          const response = await fetch(
            "http://teacherdev09.kro.kr:10002/endpoint/api/users/signup",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                email,
                password,
                name,
                address,
              }),
            },
          );

          const data = await response.json();
          if (!response.ok) {
            throw new Error("회원가입에 실패했습니다.");
          }

          alert("회원가입이 완료되었습니다.");
          window.location.href = "./login-page.html";
        } catch (error) {
          alert(error.message);
        }
      });
      document.getElementById("loginPage-btn").addEventListener("click", () => {
        window.location.href = "./login-page.html";
      });
    </script>
  </body>
</html>
