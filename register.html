<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="login-container">
    <div class="info">
      <h1>회원가입</h1>
    </div>
    <form>
      <div class="info">
        아이디
        <input class="signInput" id="userId" name="email" type="text" placeholder="이메일을 입력하세요." />
      </div>
      <div class="info">
        비밀번호
        <input class="signInput" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요." />
      </div>
      <div class="info">
        비밀번호
        <input class="signInput" id="name" name="name" type="text" placeholder="이름을 입력하세요." />
      </div>
      <div class="info">
        비밀번호
        <input class="signInput" id="address" name="address" type="text" placeholder="주소를 입력하세요." />
      </div>
      <button id="login-btn">회원가입</button>
    </form>
    <button id="loginPage-btn">로그인</button>
  </div>

  <script>
    document.querySelector("form").addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = e.target.email.value;
      const password = e.target.password.value;
      const name = e.target.name.value;
      const address = e.target.address.value;
      try {
        const response = await fetch("http://teacherdev09.kro.kr:10002/endpoint/api/users/signup", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name, address })
        });
        if (!response.ok) {
          throw new Error("서버 저장 실패");
        }
        const result = await response.json();
        console.log("서버에 저장 완료:", result);
        alert('회원가입이 완료되었습니다!')
      } catch (error) {
        alert(error.message)
      }
    })
  </script>
</body>

</html>
