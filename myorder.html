<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 주문내역</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/mypage.css" />
  </head>

  <body>
    <section class="demo-holy-grid">
      <div class="hg-header">
        <nav class="demo-nav">
          <div class="logo"><a href="index.html">전설의 시작</a></div>
          <div class="searchbox">
            <input
              type="text"
              class="searchbox_text"
              placeholder="검색어를 입력하세요."
            />
            <button>
              <img class="btn-img" src="search_icon.png" alt="검색버튼" />
            </button>
          </div>
          <ul class="menu-list">
            <li><a href="login-page.html" id="login-page">로그인</a></li>
            <li>
              <a href="mypage.html" style="display: none" class="loginout"
                >내 정보</a
              >
            </li>
            <li>
              <a href="" style="display: none" id="logout-btn" class="loginout"
                >로그아웃</a
              >
            </li>
          </ul>
        </nav>
      </div>
      <div class="user-container myorder_container">
        <div class="info myorder_info">
          <h1>주문 내역</h1>
        </div>
        <form>
          <div class="orderInfo">
            <div class="user-info">
              <span class="label">주문 번호 : </span>
              <span class="value" id="orderNum">주문 내역이 없습니다.</span>
              <!-- ⬅️ 빈칸에 글자를 채워줍니다 -->
            </div>
            <div class="user-info">
              <span class="label">주문 상품 : </span>
              <span class="value" id="product">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">가격 : </span>
              <span class="value" id="price">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">수량 : </span>
              <span class="value" id="quantity">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">총금액 : </span>
              <span class="value" id="orderPrice">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">상태 : </span>
              <span class="value" id="orderStatus">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">주문일자 : </span>
              <span class="value" id="orderDate">주문 내역이 없습니다.</span>
            </div>
          </div>
        </form>
      </div>
      <div class="hg-footer"></div>
    </section>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. 가장 먼저 토큰(로그인 여부)부터 확인합니다.
      const token = sessionStorage.getItem("accessToken");

      if (!token) {
        alert("로그인이 필요한 페이지입니다.");
        window.location.href = "login-page.html"; // 로그인 페이지로 튕겨냅니다.
        return; // 아래 코드가 실행되지 않도록 막습니다.
      }

      // 2. 상단바 메뉴를 '로그인 된 상태'로 바꿔줍니다.
      const loginButton = document.querySelector("#login-page");
      const logoutButtons = document.querySelectorAll(".loginout");
      if (loginButton) {
        loginButton.style.display = "none";
        logoutButtons.forEach((e) => (e.style.display = "inline"));
      }

      // 3. 서버에서 데이터 가져오기
      try {
        // 💡 주의: 현재 API 주소가 내 정보 조회(/users/me)로 되어있습니다.
        // 나중에 백엔드에 '내 주문 내역' API가 만들어지면 그 주소로 바꿔야 합니다!
        const response = await fetch(
          "http://teacherdev09.kro.kr:10002/endpoint/api/users/me",
          {
            method: "GET",
            headers: { Authorization: "Bearer " + token },
          },
        );

        if (!response.ok) {
          throw new Error("서버 연결 실패");
        }

        const data = await response.json();
        console.log("불러온 데이터:", data); // F12 개발자 도구에서 데이터를 확인할 수 있습니다.

        // 💡 나중에 주문 내역 API가 연결되면, 아래 주석을 풀고 데이터를 연결해주시면 됩니다!
        /*
        document.querySelector("#orderNum").textContent = "주문 번호 : " + data.orderId;
        document.querySelector("#product").textContent = "주문 상품 : " + data.productName;
        document.querySelector("#price").textContent = "가격 : " + data.price;
        // ... (나머지 정보들)
        */
      } catch (error) {
        alert("데이터를 불러오는데 실패했습니다: " + error.message);
      }
    });

    // 4. 로그아웃 기능 (상단바 로그아웃 버튼 전용)
    const logoutBtn = document.querySelector("#logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", (e) => {
        e.preventDefault();
        sessionStorage.removeItem("accessToken");
        alert("로그아웃 되었습니다");
        window.location.href = "index.html"; // 로그아웃 후 메인으로 이동
      });
    }
  </script>
</html>
