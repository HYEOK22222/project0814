<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 주문내역</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/mypage.css" />
  </head>

  <body>
    <section class="demo-holy-grid">
      <div class="hg-header">
        <nav class="demo-nav">
          <div class="logo"><a href="index.html">전설의 시작</a></div>
          <div class="searchbox">
            <!-- ⬇️ 카테고리 선택창 추가 -->
            <select id="category-select" class="custom-select">
              <option value="">카테고리 선택</option>
            </select>
            <input
              type="text"
              class="searchbox_text"
              placeholder="검색어를 입력하세요."
            />
            <button>
              <img class="btn-img" src="search_icon.png" alt="검색버튼" />
            </button>
          </div>
          <ul class="menu-list">
            <li><a href="login-page.html" id="login-page">로그인</a></li>
            <li>
              <a
                href="myorder.html"
                id="myorder"
                style="display: none"
                class="loginout"
                >내 주문 내역</a
              >
            </li>
            <li>
              <a href="mypage.html" style="display: none" class="loginout"
                >내 정보</a
              >
            </li>
            <li>
              <a href="" style="display: none" id="logout-btn" class="loginout"
                >로그아웃</a
              >
            </li>
          </ul>
        </nav>
      </div>
      <div class="user-container myorder_container">
        <div class="info myorder_info">
          <h1>주문 내역</h1>
        </div>
        <form>
          <div class="orderInfo">
            <div class="user-info">
              <span class="label">주문 번호 : </span>
              <span class="value" id="orderNum">주문 내역이 없습니다.</span>
              <!-- ⬅️ 빈칸에 글자를 채워줍니다 -->
            </div>
            <div class="user-info">
              <span class="label">주문 상품 : </span>
              <span class="value" id="product">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">가격 : </span>
              <span class="value" id="price">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">수량 : </span>
              <span class="value" id="quantity">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">총금액 : </span>
              <span class="value" id="orderPrice">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">상태 : </span>
              <span class="value" id="orderStatus">주문 내역이 없습니다.</span>
            </div>
            <div class="user-info">
              <span class="label">주문일자 : </span>
              <span class="value" id="orderDate">주문 내역이 없습니다.</span>
            </div>
          </div>
        </form>
      </div>
      <div class="hg-footer"></div>
    </section>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. 가장 먼저 토큰(로그인 여부)부터 확인합니다.
      const token = sessionStorage.getItem("accessToken");

      if (!token) {
        alert("로그인이 필요한 페이지입니다.");
        window.location.href = "login-page.html"; // 로그인 페이지로 튕겨냅니다.
        return; // 아래 코드가 실행되지 않도록 막습니다.
      }

      // 2. 상단바 메뉴를 '로그인 된 상태'로 바꿔줍니다.
      const loginButton = document.querySelector("#login-page");
      const logoutButtons = document.querySelectorAll(".loginout");
      if (loginButton) {
        loginButton.style.display = "none";
        logoutButtons.forEach((e) => (e.style.display = "inline"));
      }

      // 3. 로그아웃 기능 (상단바 로그아웃 버튼 전용)
      const logoutBtn = document.querySelector("#logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", (e) => {
          e.preventDefault();
          sessionStorage.removeItem("accessToken");
          alert("로그아웃 되었습니다");
          window.location.href = "index.html"; // 로그아웃 후 메인으로 이동
        });
      }

      // 4. 서버에서 데이터 가져오기
      try {
        const response = await fetch(
          "http://teacherdev09.kro.kr:10002/endpoint/api/users/me",
          {
            method: "GET",
            headers: { Authorization: "Bearer " + token },
          },
        );

        if (!response.ok) {
          throw new Error("서버 연결 실패");
        }

        const data = await response.json();
        console.log("불러온 데이터:", data);

        // 💡 나중에 주문 내역 API가 연결되면, 아래 주석을 풀고 데이터를 연결해주시면 됩니다!
        /*
        document.querySelector("#orderNum").textContent = data.orderId;
        document.querySelector("#product").textContent = data.productName;
        document.querySelector("#price").textContent = data.price;
        // ... (나머지 정보들도 동일하게 값만 넣어주세요!)
        */
      } catch (error) {
        console.error(
          "주문 내역 데이터를 불러오는데 실패했습니다: " + error.message,
        );
      }

      // ==========================================
      // 🔍 5. 공통 검색 리다이렉트 (index.html로 이동)
      // ==========================================
      const searchInput = document.querySelector(".searchbox input");
      const searchBtn = document.querySelector(".searchbox button");
      const categorySelect = document.querySelector("#category-select");

      if (searchInput && searchBtn) {
        const executeSearchRedirect = () => {
          const keyword = searchInput.value.trim();
          const category = categorySelect ? categorySelect.value : "";

          // 검색어도 없고 카테고리도 선택 안 했으면 막기
          if (!keyword && !category) {
            alert("검색어를 입력하거나 카테고리를 선택해주세요.");
            return;
          }

          // 검색어와 카테고리를 달고 index.html로 이동!
          window.location.href = `index.html?keyword=${encodeURIComponent(keyword)}&category=${encodeURIComponent(category)}`;
        };

        searchBtn.addEventListener("click", executeSearchRedirect);
        searchInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") executeSearchRedirect();
        });

        if (categorySelect) {
          categorySelect.addEventListener("change", executeSearchRedirect);
        }
      }

      // ==========================================
      // 🗂️ 6. 상단바 카테고리 API에서 동적으로 불러오기
      // ==========================================
      if (categorySelect && categorySelect.options.length <= 1) {
        try {
          const res = await fetch(
            "http://teacherdev09.kro.kr:10002/endpoint/api/products?size=50",
          );
          const result = await res.json();

          if (result.success && result.data && result.data.content) {
            const allProducts = result.data.content;

            // 카테고리 중복 제거
            const categories = [
              ...new Set(allProducts.map((p) => p.category).filter(Boolean)),
            ];

            // option 태그 추가
            categories.forEach((category) => {
              const option = document.createElement("option");
              option.value = category;
              option.textContent = category;
              categorySelect.appendChild(option);
            });
          }
        } catch (error) {
          console.error("카테고리를 불러오지 못했습니다.", error);
        }
      }
    }); // <-- DOMContentLoaded 닫히는 괄호
  </script>
</html>
