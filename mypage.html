<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/mypage.css" />
  </head>

  <body>
    <section class="demo-holy-grid">
      <div class="hg-header">
        <nav class="demo-nav">
          <div class="logo"><a href="index.html">전설의 시작</a></div>
          <div class="searchbox">
            <!-- ⬇️ 기존 코드 건드리지 않고 이 부분만 한 줄 추가합니다! -->
            <select id="category-select" class="custom-select">
              <option value="">카테고리 선택</option>
            </select>

            <input
              type="text"
              class="searchbox_text"
              placeholder="검색어를 입력하세요."
            />
            <button>
              <img class="btn-img" src="search_icon.png" alt="검색버튼" />
            </button>
          </div>
          <ul class="menu-list">
            <li><a href="login-page.html" id="login-page">로그인</a></li>
            <li>
              <a
                href="myorder.html"
                id="myorder"
                style="display: none"
                class="loginout"
                >내 주문 내역</a
              >
            </li>
            <li>
              <a href="mypage.html" style="display: none" class="loginout"
                >내 정보</a
              >
            </li>
            <li>
              <a href="" style="display: none" id="logout-btn" class="loginout"
                >로그아웃</a
              >
            </li>
          </ul>
        </nav>
      </div>
      <div class="user-container">
        <div class="info myorder_info">
          <h1>My page</h1>
        </div>
        <form>
          <div class="mypage_info">
            <div class="user-info" id="name">회원 이름 :</div>
            <div class="user-info" id="email">회원 이메일 :</div>
            <div class="user-info" id="address">회원 주소 :</div>
          </div>
        </form>
      </div>
      <div class="hg-footer"></div>
    </section>
  </body>
  <script>
    // =======================================================
    // ⬇️ 동료분이 작성하신 기존 코드 (건드리지 않음)
    // =======================================================
    (async () => {
      try {
        const token = sessionStorage.getItem("accessToken");
        const response = await fetch(
          "http://teacherdev09.kro.kr:10002/endpoint/api/users/me",
          {
            method: "GET",
            headers: { Authorization: "Bearer " + token },
          },
        );
        if (!token) {
          alert("로그인이 필요한 페이지 잆니다.");
          window.location.href = "./index.html";
          return;
        }
        if (!response.ok) {
          throw new Error("서버 연결 실패");
        }
        const data = await response.json();
        document.querySelector("#name").textContent =
          "회원 이름 : " + data.data.name;
        document.querySelector("#email").textContent =
          "회원 이메일 : " + data.data.email;
        document.querySelector("#address").textContent =
          "회원 주소 : " + data.data.address;
      } catch (error) {
        alert(error.message);
      }
    })();

    document.querySelector("#logout-btn").addEventListener("click", () => {
      sessionStorage.removeItem("accessToken");
      alert("로그아웃 되었습니다");
      window.location.href = "./index.html";
    });

    // =======================================================
    // ⬇️ 여기서부터 새로 추가된 카테고리/검색 연동 코드입니다!
    // =======================================================
    document.addEventListener("DOMContentLoaded", async () => {
      const token = sessionStorage.getItem("accessToken");
      const loginButton = document.querySelector("#login-page");
      const logoutButtons = document.querySelectorAll(".loginout");
      if (token) {
        if (loginButton) loginButton.style.display = "none";
        logoutButtons.forEach((e) => (e.style.display = "inline"));
      }
      const searchInput = document.querySelector(".searchbox input");
      const searchBtn = document.querySelector(".searchbox button");
      const categorySelect = document.querySelector("#category-select");

      // 🔍 공통 검색 리다이렉트 (index.html로 이동)
      if (searchInput && searchBtn) {
        const executeSearchRedirect = () => {
          const keyword = searchInput.value.trim();
          const category = categorySelect ? categorySelect.value : "";

          if (!keyword && !category) {
            alert("검색어를 입력하거나 카테고리를 선택해주세요.");
            return;
          }

          window.location.href = `index.html?keyword=${encodeURIComponent(keyword)}&category=${encodeURIComponent(category)}`;
        };

        searchBtn.addEventListener("click", executeSearchRedirect);
        searchInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") executeSearchRedirect();
        });

        if (categorySelect) {
          categorySelect.addEventListener("change", executeSearchRedirect);
        }
      }

      // 🗂️ 상단바 카테고리 API에서 동적으로 불러오기
      if (categorySelect && categorySelect.options.length <= 1) {
        try {
          const res = await fetch(
            "http://teacherdev09.kro.kr:10002/endpoint/api/products?size=50",
          );
          const result = await res.json();

          if (result.success && result.data && result.data.content) {
            const allProducts = result.data.content;
            const categories = [
              ...new Set(allProducts.map((p) => p.category).filter(Boolean)),
            ];

            categories.forEach((category) => {
              const option = document.createElement("option");
              option.value = category;
              option.textContent = category;
              categorySelect.appendChild(option);
            });
          }
        } catch (error) {
          console.error("카테고리를 불러오지 못했습니다.", error);
        }
      }
    });
  </script>
</html>
