<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/mypage.css" />
</head>

<body>
  <section class="demo-holy-grid">
    <div class="hg-header">
      <nav class="demo-nav">
        <div class="logo"><a href="index.html">전설의 시작</a></div>
        <ul class="menu-list">
          <li><a href="">상품목록</a></li>
          <li><a href="">리뷰</a></li>
          <li><a href="">주문</a></li>
          <li><a href="index.html">로그아웃</a></li>
        </ul>
        <input type="text" placeholder="검색어를 입력하세요." />
        <button>
          <img class="btn-img" src="search_icon.png" alt="검색버튼" />
        </button>
      </nav>
    </div>
    <div class="user-container">
      <div class="info">
        <h1>My page</h1>
      </div>
      <form>
        <div class="info">
          <div class="user-info" id="name">회원 이름 : </div>
          <div class="user-info" id="email">회원 이메일 : </div>
          <div class="user-info" id="address">회원 주소 : </div>
        </div>
      </form>
    </div>
    <div class="hg-footer"></div>
  </section>
</body>
<script>
  (async () => {
    try {
      const token = sessionStorage.getItem("accessToken");
      const response = await fetch(
        "http://teacherdev09.kro.kr:10002/endpoint/api/users/me",
        {
          method: "GET",
          headers: { Authorization: "Bearer " + token },
        });
      if (!token) {
        alert('로그인이 필요한 페이지 잆니다.');
        window.location.href = "./index.html";
        return;
      }
      if (!response.ok) {
        throw new Error("서버 연결 실패")
      }
      const data = await response.json();
      document.querySelector("#name").textContent = "회원 이름 : " + data.data.name;
      document.querySelector("#email").textContent = "회원 이메일 : " + data.data.email;
      document.querySelector("#address").textContent = "회원 주소 : " + data.data.address;
    } catch (error) {
      alert(error.message);
    }
  })();

  document.querySelector("#logout-btn").addEventListener("click", () => {
    sessionStorage.removeItem("accessToken");
    alert('로그아웃 되었습니다');
    window.location.href = "./index.html";
  })
</script>

</html>
