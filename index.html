<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전설의 시작</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <div class="demo-holy-grid">
      <div class="hg-header">
        <nav class="demo-nav">
          <div class="logo"><a href="index.html">전설의 시작</a></div>
          <div class="searchbox">
            <select id="category-select" class="custom-select">
              <option value="">카테고리 선택</option>
            </select>
            <input
              type="text"
              class="searchbox_text"
              placeholder="검색어를 입력하세요."
            />
            <button id="main-search-btn">
              <img class="btn-img" src="search_icon.png" alt="검색버튼" />
            </button>
          </div>
          <ul class="menu-list">
            <li><a href="login-page.html" id="login-page">로그인</a></li>
            <li>
              <a
                href="myorder.html"
                id="myorder"
                style="display: none"
                class="loginout"
                >내 주문 내역</a
              >
            </li>
            <li>
              <a href="mypage.html" style="display: none" class="loginout"
                >내 정보</a
              >
            </li>
            <li>
              <a href="" style="display: none" id="logout-btn" class="loginout"
                >로그아웃</a
              >
            </li>
          </ul>
        </nav>
      </div>

      <div class="hg-content">
        <section class="demo-product-grid">
          <div id="product-list" class="demo-product-card productcard2"></div>
        </section>
      </div>
    </div>

    <script src="/js/common.js"></script>

    <script>
      window.addEventListener("DOMContentLoaded", async () => {
        // ====================================================
        // 1. 공통 로그인/로그아웃 처리
        // ====================================================
        const isLoggedIn = sessionStorage.getItem("accessToken");
        const loginButton = document.querySelector("#login-page");
        if (isLoggedIn && loginButton) {
          loginButton.style.display = "none";
          const logout = document.querySelectorAll(".loginout");
          logout.forEach((e) => {
            e.style.display = "inline";
          });
        }

        const logoutBtn = document.querySelector("#logout-btn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", (e) => {
            e.preventDefault();
            sessionStorage.removeItem("accessToken");
            alert("로그아웃 되었습니다");
            window.location.href = "./index.html";
          });
        }

        // ====================================================
        // 2. 상품 렌더링 및 검색 기능 세팅
        // ====================================================
        const productListEl = document.getElementById("product-list");
        const searchInput = document.querySelector(".searchbox input");
        const searchBtn = document.querySelector("#main-search-btn");
        const categorySelect = document.getElementById("category-select");

        // 로딩 화면 & 결과 없음 UI 만들기
        const loadingMsg = document.createElement("div");
        loadingMsg.innerHTML =
          "<h3 style='color: #fff;'>⏳ 검색 중입니다...</h3>";
        loadingMsg.style.cssText =
          "width: 100%; text-align: center; padding: 50px; display: none;";

        const noResultMsg = document.createElement("div");
        noResultMsg.innerHTML =
          "<h3 style='color: #888;'>❌ 조건에 맞는 상품이 없습니다.</h3>";
        noResultMsg.style.cssText =
          "width: 100%; text-align: center; padding: 50px; display: none;";

        productListEl.parentNode.insertBefore(loadingMsg, productListEl);
        productListEl.parentNode.insertBefore(noResultMsg, productListEl);

        let allProducts = [];

        // 상품 데이터 가져오기
        try {
          const res = await fetch(
            "http://teacherdev09.kro.kr:10002/endpoint/api/products?size=50",
          );
          const result = await res.json();

          if (result.success && result.data && result.data.content) {
            allProducts = result.data.content;

            // 카테고리 중복 제거 후 select 태그에 추가
            const categories = [
              ...new Set(allProducts.map((p) => p.category).filter(Boolean)),
            ];

            // ⭐ [여기가 핵심!] 카테고리를 조립해서 넣기 전에,
            // 혹시라도 중복으로 들어있을지 모를 내용물을 싹 비우고 기본 뼈대만 남깁니다!
            if (categorySelect) {
              categorySelect.innerHTML =
                '<option value="">카테고리 선택</option>';
            }

            // 그 다음에 새 카테고리들을 하나씩 착착착 넣어줍니다.
            categories.forEach((category) => {
              const option = document.createElement("option");
              option.value = category;
              option.textContent = category;
              if (categorySelect) categorySelect.appendChild(option);
            });
          }
        } catch (error) {
          console.error("데이터 로드 실패", error);
        }

        // 화면에 상품 그리는 함수
        function renderFilteredProducts(filtered) {
          loadingMsg.style.display = "none";
          productListEl.innerHTML = "";

          if (filtered.length === 0) {
            noResultMsg.style.display = "block";
            productListEl.style.display = "none";
            return;
          }

          noResultMsg.style.display = "none";
          productListEl.style.display = "grid";

          for (let i = filtered.length - 1; i >= 0; i--) {
            const $a = document.createElement("a");
            const $div = document.createElement("div");
            const $h4 = document.createElement("h4");
            const $p = document.createElement("p");

            $a.href = `product-detail.html?id=${filtered[i].id}`;
            $div.setAttribute("class", "info");

            $h4.textContent = filtered[i].name;
            const priceString = filtered[i].price.toLocaleString() + "원";
            $p.textContent = priceString;

            $div.append($h4, $p);
            $a.appendChild($div);
            productListEl.appendChild($a);
          }
        }

        // 검색 실행 함수
        function executeSearch() {
          productListEl.style.display = "none";
          noResultMsg.style.display = "none";
          loadingMsg.style.display = "block";

          setTimeout(() => {
            const keyword = searchInput.value.toLowerCase().trim();
            const selectedCategory = categorySelect ? categorySelect.value : "";

            const filtered = allProducts.filter((product) => {
              const matchKeyword = product.name.toLowerCase().includes(keyword);
              const matchCategory =
                selectedCategory === "" ||
                product.category === selectedCategory;
              return matchKeyword && matchCategory;
            });

            renderFilteredProducts(filtered);
          }, 300);
        }

        // 이벤트 리스너 등록
        if (searchBtn) searchBtn.addEventListener("click", executeSearch);
        if (categorySelect)
          categorySelect.addEventListener("change", executeSearch);
        if (searchInput) {
          searchInput.addEventListener("keyup", (event) => {
            if (event.key === "Enter") executeSearch();
          });
        }

        // ====================================================
        // ⭐ 3. 외부에서 검색어 달고 왔을 때 자동 실행 파트
        // ====================================================
        const urlParams = new URLSearchParams(window.location.search);
        const keywordFromUrl = urlParams.get("keyword");
        const categoryFromUrl = urlParams.get("category"); // ⭐ 주소창에서 카테고리 값 뽑아오기

        // 검색어나 카테고리 둘 중 하나라도 달고 넘어왔다면?
        if (keywordFromUrl || categoryFromUrl) {
          if (keywordFromUrl && searchInput) {
            searchInput.value = keywordFromUrl; // 검색창에 텍스트 채우기
          }

          if (categoryFromUrl && categorySelect) {
            categorySelect.value = categoryFromUrl; // ⭐ 카테고리 셀렉트박스 선택 상태로 바꾸기
          }

          executeSearch(); // 곧바로 검색 실행!
        } else {
          // 둘 다 없으면 그냥 전체 상품 띄워주기!
          renderFilteredProducts(allProducts);
        }
      }); // <-- DOMContentLoaded 닫히는 괄호가 반드시 맨 마지막에 와야 합니다!
    </script>
  </body>
</html>
