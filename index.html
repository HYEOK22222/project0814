<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전설의 시작</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <section class="demo-holy-grid">
    <div class="hg-header">
      <nav class="demo-nav">
        <div class="logo"><a href="index.html">전설의 시작</a></div>
        <ul class="menu-list">
          <li><a href="">상품목록</a></li>
          <li><a href="">리뷰</a></li>
          <li><a href="">주문</a></li>
          <li><a href="login-page.html" id="login-page">로그인</a></li>
          <li><a href="mypage.html" style="display: none;" class="loginout">내 정보</a></li>
          <li><a href="" style="display: none;" id="logout-btn" class="loginout">로그아웃</a></li>
        </ul>
        <input type="text" placeholder="검색어를 입력하세요." />
        <button>
          <img class="btn-img" src="search_icon.png" alt="검색버튼" />
        </button>
      </nav>
    </div>
    <div class="hg-content">
      <section class="demo-product-grid">
        <div class="demo-product-card"><a href="product-detail.html">
          <div class="img-placeholder">
            <img src="" alt="" />
          </div>
          <div class="info">
            <h4>스마트 기계식 키보드 1호</h4>
            <p>470,000</p>
          </div></a>
        </div>
        <div class="demo-product-card">
          <div class="img-placeholder"><img src="" alt="" /></div>
          <div class="info">
            <h4>닌텐도스위치2</h4>
            <p>700,000</p>
          </div>
        </div>
        <div class="demo-product-card">
          <div class="img-placeholder">상품</div>
          <div class="info">
            <h4>닌텐도스위치2</h4>
            <p>700,000</p>
          </div>
        </div>
        <div class="demo-product-card">
          <div class="img-placeholder">상품2</div>
          <div class="info">
            <h4>닌텐도스위치2</h4>
            <p>700,000</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const isLoggedIn = sessionStorage.getItem("accessToken");
        const loginButton = document.querySelector("#login-page");
        if (isLoggedIn && loginButton) {
          loginButton.style.display = "none"
          const logout = document.querySelectorAll(".loginout")
          logout.forEach(e => {
            e.style.display = "inline"
          })
        }
      })

      document.querySelector("#logout-btn").addEventListener("click", () => {
        sessionStorage.removeItem("accessToken");
        alert('로그아웃 되었습니다')
        window.location.href = "./index.html"
      });
    </script>
</body>

</html>
